name: Release

# Push an explicitly approved version tag to build the package and attach the tarball to a
# GitHub release. Consumers download and install the latest release with:
#   gh release download --repo qingye-lab/qingye-ui --pattern 'qingye_lab-ui-*.tgz' --output qingye-ui.tgz --clobber && pnpm add ./qingye-ui.tgz
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package v$version"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:facts
      - run: node --test scripts/lib/process-exit.test.mjs scripts/lib/delivery-contracts.test.mjs
      - run: pnpm --filter @qingye_lab/ui exec vitest run --config ../../apps/studio/test/preview.config.ts
      - run: pnpm --filter @qingye_lab/ui build
      - name: Build Studio
        run: pnpm studio:build
      - name: Build docs
        run: pnpm --filter docs build
      - name: Install audit browser
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Browser audit
        run: |
          mkdir -p test-results/release-audit
          node scripts/run-browser-audit.mjs --report test-results/release-audit/report.json
      - name: Current compositions, foundations and Studio
        run: |
          node scripts/run-browser-audit.mjs --patterns
          node scripts/run-browser-audit.mjs --foundations
          node scripts/verify-studio.mjs
      - name: Upload composition and theme evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-and-theme-evidence
          path: |
            test-results/task-patterns/
            test-results/ui-foundations-final/
            test-results/studio/**/report.json
            test-results/studio/**/*.png
          if-no-files-found: warn
      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-audit-evidence
          path: test-results/release-audit/
          if-no-files-found: warn
      - name: Pack
        run: |
          mkdir -p dist-pack
          pnpm --filter @qingye_lab/ui pack --pack-destination "$GITHUB_WORKSPACE/dist-pack"
          pnpm --filter @qingye/tooling pack --pack-destination "$GITHUB_WORKSPACE/dist-pack"
          ls dist-pack/*.tgz
      - name: Verify installed package consumers
        run: node scripts/verify-packed-consumers.mjs --tgz "dist-pack/$(node -p "const p=require('./packages/ui/package.json'); p.name.slice(1).replace('/', '-')+'-'+p.version+'.tgz'")"
      - name: Verify installed tooling
        run: node scripts/verify-packed-tooling.mjs "dist-pack/$(node -p "const p=require('./packages/ui/package.json'); p.name.slice(1).replace('/', '-')+'-'+p.version+'.tgz'")" "dist-pack/qingye-tooling-$(node -p "require('./packages/tooling/package.json').version").tgz"
      - name: Upload installed consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-consumer-evidence
          path: |
            test-results/packed-consumers/**/report.json
            test-results/packed-consumers/**/*.png
            test-results/packed-consumers/**/*.log
            test-results/packed-tooling/**/report.json
            test-results/packed-tooling/**/*.log
          if-no-files-found: warn
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-pack/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
