name: Release

# Push a tag like v0.1.0 to build the package and attach the tarball to a
# GitHub release. Consumers install it with:
#   pnpm add https://github.com/qingye-lab/yanqing-ui/releases/download/v0.1.0/yanqing-ui-0.1.0.tgz
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package v$version"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm --filter @yanqing/ui test
      - run: pnpm --filter @yanqing/ui build
      - name: Pack
        run: |
          mkdir -p dist-pack
          pnpm --filter @yanqing/ui pack --pack-destination ../../dist-pack
          ls dist-pack
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-pack/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
