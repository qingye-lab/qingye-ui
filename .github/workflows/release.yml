name: Release

# Push a tag like v0.2.0 to build the package and attach the tarball to a
# GitHub release. Consumers install it with:
#   gh release download v0.2.0 --repo qingye-lab/qingye-ui --pattern qingye-ui-0.2.0.tgz
#   pnpm add ./qingye-ui-0.2.0.tgz
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package v$version"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm --filter @qingye/ui test
      - run: pnpm --filter @qingye/ui build
      - name: Build docs
        run: pnpm --filter docs build
      - name: Install audit browser
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Browser audit
        run: |
          mkdir -p test-results/release-audit
          node scripts/run-browser-audit.mjs --report test-results/release-audit/report.json
      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-audit-evidence
          path: test-results/release-audit/
          if-no-files-found: warn
      - name: Pack
        run: |
          mkdir -p dist-pack
          pnpm --filter @qingye/ui pack --pack-destination "$GITHUB_WORKSPACE/dist-pack"
          ls dist-pack/*.tgz
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-pack/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
