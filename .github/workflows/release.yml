name: Release

# Push an explicitly approved version tag to build the package, publish it to npm through
# Trusted Publishing (GitHub OIDC, no token or local 2FA) and attach the tarball to a GitHub release. Consumers download and install the latest release with:
#   gh release download --repo qingye-lab/qingye-ui --pattern 'qingye_lab-ui-*.tgz' --output qingye-ui.tgz --clobber && pnpm add ./qingye-ui.tgz
#
# 类型检查、测试、浏览器审计、安装后消费者验证都已在 CI 里对同一个提交跑过；
# 这里只确认该提交的 CI 通过，然后构建、打包、发布。
on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 同一提交的 CI 必须已通过（正在运行就等待），否则不发布。
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require a green CI run for this commit
        run: |
          deadline=$((SECONDS + 1500))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=50" --jq '.workflow_runs')
            if [ "$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')" -gt 0 ]; then
              echo "CI passed for $GITHUB_SHA"; exit 0
            fi
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$pending" -eq 0 ]; then
              echo "::error::no successful CI run for $GITHUB_SHA (runs: $(echo "$runs" | jq -c '[.[] | {event, status, conclusion}]'))"
              exit 1
            fi
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::CI for $GITHUB_SHA still running after 25 minutes"; exit 1; }
            echo "CI still running for $GITHUB_SHA, waiting"; sleep 20
          done

  release:
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package v$version"; exit 1; }
      - name: Build library
        run: pnpm --filter @qingye_lab/ui build
      - name: Check package contents and types
        run: pnpm --filter @qingye_lab/ui check:pack
      - name: Pack
        run: |
          mkdir -p dist-pack
          pnpm --filter @qingye_lab/ui pack --pack-destination "$GITHUB_WORKSPACE/dist-pack"
          pnpm --filter @qingye/tooling pack --pack-destination "$GITHUB_WORKSPACE/dist-pack"
          ls dist-pack/*.tgz
      - name: Publish to npm
        run: |
          # Trusted Publishing needs npm >= 11.5.1; the package page on npmjs.com must name this
          # repository and release.yml as its trusted publisher.
          npm install -g npm@^11.5.1
          name=$(node -p "require('./packages/ui/package.json').name")
          version=$(node -p "require('./packages/ui/package.json').version")
          if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
          else
            tag=latest; case "$version" in *-*) tag=next;; esac
            npm publish "./dist-pack/qingye_lab-ui-$version.tgz" --access public --tag "$tag" --registry https://registry.npmjs.org
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-pack/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
