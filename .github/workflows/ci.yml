name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm --filter @yanqing/ui test
      - name: Build library
        run: pnpm --filter @yanqing/ui build
      - name: Build docs
        run: pnpm --filter docs build
      - name: Pack
        run: pnpm --filter @yanqing/ui pack --pack-destination ../../dist-pack
      - uses: actions/upload-artifact@v4
        with:
          name: yanqing-ui-package
          path: dist-pack/*.tgz
